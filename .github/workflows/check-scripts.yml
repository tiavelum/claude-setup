name: check-scripts

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  SHELLCHECK_VERSION: v0.10.0
  SHELLCHECK_SHA256: 6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87
  SHFMT_VERSION: v3.10.0
  SHFMT_SHA256: 1f57a384d59542f8fac5f503da1f3ea44242f46dff969569e80b524d64b71dbc
  RUFF_VERSION: 0.16.6

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install shellcheck and shfmt
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP"
          curl -fsSL -o shellcheck.tar.xz "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  shellcheck.tar.xz" | sha256sum --check
          tar -xJf shellcheck.tar.xz
          mv "shellcheck-${SHELLCHECK_VERSION}/shellcheck" bin/
          curl -fsSL -o bin/shfmt "https://github.com/mvdan/sh/releases/download/${SHFMT_VERSION}/shfmt_${SHFMT_VERSION}_linux_amd64"
          echo "${SHFMT_SHA256}  bin/shfmt" | sha256sum --check
          chmod +x bin/shfmt
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Check formatting
        run: shfmt -d .

      - name: Lint
        run: shfmt -f . | xargs shellcheck

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.9"

      - name: Install ruff
        run: pip install "ruff==${RUFF_VERSION}"

      - name: Check Python formatting
        run: ruff format --check .

      - name: Lint Python
        run: ruff check .

      - name: Run session-usage.py on a sample record
        run: |
          mkdir -p "$RUNNER_TEMP/records"
          step='{"type":"assistant","requestId":"r1","timestamp":"2026-10-06T10:00:00Z","message":{"id":"m1","model":"claude-opus-5-5","usage":{"input_tokens":10,"cache_read_input_tokens":1000,"cache_creation_input_tokens":500,"output_tokens":100}}}'
          printf '%s\n%s\n' "$step" "$step" >"$RUNNER_TEMP/records/sample.jsonl"
          python3 session-usage.py "$RUNNER_TEMP/records/sample.jsonl" | tee "$RUNNER_TEMP/out.txt"
          grep -E '^session +1 +10 +1,000 +500 +100 +1,510$' "$RUNNER_TEMP/out.txt"

      - name: Run session-usage.py on a session spread over two project folders
        run: |
          projects="$RUNNER_TEMP/home/.claude/projects"
          old="$projects/-home-claude/s1"
          new="$projects/-home-claude-repo/s1"
          mkdir -p "$old/subagents" "$new/subagents"
          step() { printf '{"type":"assistant","requestId":"%s","timestamp":"2026-10-06T10:00:0%s","message":{"model":"claude-opus-5-5","usage":{"input_tokens":1,"output_tokens":%s}}}\n' "$1" "$2" "$3"; }
          step r1 1 10 >"$old.jsonl"
          { step r1 1 10; step r2 2 20; } >"$new.jsonl"
          step a1 3 30 >"$old/subagents/agent-old.jsonl"
          step b1 4 40 >"$new/subagents/agent-new.jsonl"
          touch -d '2026-10-06 10:00' "$old.jsonl"
          HOME="$RUNNER_TEMP/home" python3 session-usage.py | tee "$RUNNER_TEMP/out2.txt"
          grep -E '^Session s1$' "$RUNNER_TEMP/out2.txt"
          grep -E '^session +2 +2 +0 +0 +30 +1$' "$RUNNER_TEMP/out2.txt"
          grep -E '^agent-new +1 +1 +0 +0 +40 +1$' "$RUNNER_TEMP/out2.txt"
          grep -E '^agent-old +1 +1 +0 +0 +30 +1$' "$RUNNER_TEMP/out2.txt"
          grep -E '^total +4 +4 +0 +0 +100$' "$RUNNER_TEMP/out2.txt"
